services:
  backend:
    build: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: habittrack
      DB_USERNAME: habittrack
      DB_PASSWORD: habittrack_local
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
  queue:
    build: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: habittrack
      DB_USERNAME: habittrack
      DB_PASSWORD: habittrack_local
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - backend
      - redis
    command: sh -c "composer install && php artisan queue:work --tries=3"
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: habittrack
      MYSQL_USER: habittrack
      MYSQL_PASSWORD: habittrack_local
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_only"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
volumes:
  mysql_data:
